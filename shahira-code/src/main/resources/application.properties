spring.application.name=codeviz

# Use local MongoDB by default; override with SPRING_PROFILES_ACTIVE if needed
spring.profiles.active=${SPRING_PROFILES_ACTIVE:mongodb}

app.auth.google.client-id=540051593546-q13a5gco79jf9p7d0t140bqfnabl1rn4.apps.googleusercontent.com

# Frontend domains allowed to call the Render backend.
# Override on Render with APP_CORS_ALLOWED_ORIGINS.
app.cors.allowed-origins=${APP_CORS_ALLOWED_ORIGINS:http://localhost:5173,http://127.0.0.1:5173,https://shahiracode.in,https://www.shahiracode.in}

# Self-hosted Piston endpoint (override with APP_PISTON_EXECUTE_URL or app.piston.execute-url)
app.piston.execute-url=${APP_PISTON_EXECUTE_URL:http://localhost:2000/api/v2/execute}
